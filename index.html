<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css"/>
<title>Dangdut Delay Player</title>
</head>

<body>

<div class="container">
    <h1>Digital Loudspeaker Management</h1>

    <!-- FILE INPUT -->
    <input type="file" id="fileInput" accept="audio/*">

    <!-- AUDIO PLAYER -->
    <audio id="audio" controls></audio>

    <!-- VISUALIZER -->
    <canvas id="visualizer"></canvas>

    <!-- 🔥 MASTER (WAJIB ADA) -->
    <div class="knob-wrap master">
        <div class="knob" id="masterKnob"></div>
        <p>MASTER <span class="value" id="masterVal">1.00</span></p>
    </div>

    <!-- KNOB CONTROL -->
    <div class="knob-group">

        <div class="knob-wrap">
            <div class="knob" id="delayKnob"></div>
            <p>Delay <span class="value" id="delayVal">60</span></p>
        </div>

        <div class="knob-wrap">
            <div class="knob" id="feedbackKnob"></div>
            <p>Feedback <span class="value" id="feedbackVal">0.25</span></p>
        </div>

        <div class="knob-wrap">
            <div class="knob" id="wetKnob"></div>
            <p>Mix <span class="value" id="wetVal">0.5</span></p>
        </div>

    </div>

</div>

<!-- ⚠️ kalau pake modular JS -->
<script type="module" src="script.js"></script>

</body>
</html>
