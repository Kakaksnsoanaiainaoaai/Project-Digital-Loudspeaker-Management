<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangdut Delay Player</title>

<style>
body{
    font-family:sans-serif;
    background:#0f0f0f;
    color:#fff;
    text-align:center;
    padding:20px;
}

h1{
    color:gold;
}

.container{
    max-width:400px;
    margin:auto;
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

input[type="range"]{
    width:100%;
    margin:10px 0;
}

label{
    display:block;
    margin-top:15px;
    text-align:left;
}

.value{
    color:gold;
    font-size:0.9rem;
}
</style>

</head>
<body>

<div class="container">
    <h1>Digital Loudspeaker Management</h1>

    <audio id="audio" controls></audio>

    <input type="file" id="fileInput" accept="audio/*">

    <label>Delay (ms): <span class="value" id="delayVal">60</span></label>
    <input type="range" id="delaySlider" min="0" max="200" value="60">

    <label>Feedback: <span class="value" id="feedbackVal">0.25</span></label>
    <input type="range" id="feedbackSlider" min="0" max="0.8" step="0.01" value="0.25">

    <label>Effect Mix: <span class="value" id="wetVal">0.5</span></label>
    <input type="range" id="wetSlider" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
const audio = document.getElementById("audio");
const fileInput = document.getElementById("fileInput");

const delaySlider = document.getElementById("delaySlider");
const feedbackSlider = document.getElementById("feedbackSlider");
const wetSlider = document.getElementById("wetSlider");

const delayVal = document.getElementById("delayVal");
const feedbackVal = document.getElementById("feedbackVal");
const wetVal = document.getElementById("wetVal");

const ctx = new (window.AudioContext || window.webkitAudioContext)();

let source;

// NODE
const delayNode = ctx.createDelay(1.0);
const feedback = ctx.createGain();
const wetGain = ctx.createGain();
const dryGain = ctx.createGain();

// DEFAULT SETTING
delayNode.delayTime.value = 0.06;
feedback.gain.value = 0.25;
wetGain.gain.value = 0.5;
dryGain.gain.value = 1;

// ROUTING
function setupAudio(){
    if(source) source.disconnect();

    source = ctx.createMediaElementSource(audio);

    source.connect(dryGain);
    dryGain.connect(ctx.destination);

    source.connect(delayNode);
    delayNode.connect(feedback);
    feedback.connect(delayNode);
    delayNode.connect(wetGain);
    wetGain.connect(ctx.destination);
}

// LOAD FILE
fileInput.addEventListener("change", function(){
    const file = this.files[0];
    if(file){
        audio.src = URL.createObjectURL(file);
        setupAudio();
    }
});

// PLAY FIX (biar gak error di browser)
audio.onplay = () => {
    ctx.resume();
};

// DELAY CONTROL (HALUS)
delaySlider.oninput = (e) => {
    let val = e.target.value;
    delayVal.innerText = val;

    delayNode.delayTime.setTargetAtTime(
        val / 1000,
        ctx.currentTime,
        0.02
    );
};

// FEEDBACK
feedbackSlider.oninput = (e) => {
    let val = e.target.value;
    feedbackVal.innerText = val;

    feedback.gain.setTargetAtTime(
        val,
        ctx.currentTime,
        0.02
    );
};

// MIX
wetSlider.oninput = (e) => {
    let val = e.target.value;
    wetVal.innerText = val;

    wetGain.gain.setTargetAtTime(
        val,
        ctx.currentTime,
        0.02
    );
};
</script>

</body>
</html>
